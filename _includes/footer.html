<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <strong>Bryant Technology Solutions</strong>
      <p>Your Personal IT Department</p>
    </div>

    <div class="footer-meta">
      <p>&copy; {{ site.time | date: "%Y" }} Bryant Technology Solutions</p>
      <p>All rights reserved.</p>
    </div>
  </div>
</footer>
<div id="cookie-banner" class="cookie-banner">
  <p>
    We use cookies to improve site experience and analyze traffic.
    By continuing, you agree to our use of cookies.
  </p>
  <button id="accept-cookies" class="cta-button small">
    Accept
  </button>
</div>
<script>
  // Cookie banner
  const banner = document.getElementById("cookie-banner");
  const btn = document.getElementById("accept-cookies");

  if (localStorage.getItem("cookiesAccepted")) {
    banner.style.display = "none";
  }

  btn.addEventListener("click", () => {
    localStorage.setItem("cookiesAccepted", "true");
    banner.style.display = "none";
  });
</script>
