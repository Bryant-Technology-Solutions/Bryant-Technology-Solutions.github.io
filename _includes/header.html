<header class="site-header">
  <div class="container header-inner">

    <!-- Logo -->
    <div class="logo">
      <a href="{{ '/' | relative_url }}">
        <img
          src="{{ '/assets/images/logo/bts-logo.webp' | relative_url }}"
          alt="Bryant Technology Solutions — Your Personal IT Department"
          class="logo-image"
        />
      </a>
    </div>

    <!-- Hamburger -->
    <button
      class="nav-toggle"
      aria-label="Toggle navigation"
      aria-expanded="false"
      aria-controls="primary-menu"
    >
      ☰
    </button>

    <!-- Navigation -->
    <nav class="main-nav" id="primary-menu">
      <a href="{{ '/services/' | relative_url }}">Services</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/contact/' | relative_url }}">Contact</a>

      <a
        href="https://outlook.office.com/book/Consultation@bryanttechsolutions.com/"
        class="nav-cta"
        target="_blank"
        rel="noopener"
      >
        Book a Consultation
      </a>
    </nav>

  </div>
</header>

<!-- Mobile nav script -->
<script>
  const toggle = document.querySelector(".nav-toggle");
  const nav = document.querySelector(".main-nav");

  toggle.addEventListener("click", () => {
    const isOpen = nav.classList.toggle("open");
    toggle.setAttribute("aria-expanded", isOpen);
  });
</script>
